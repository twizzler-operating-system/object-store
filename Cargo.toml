[package]
name = "object-store"
version = "0.1.0"
edition = "2021"


[dependencies]
obliviate-core = { version = "0.1.0", git = "https://github.com/twizzler-operating-system/obliviate.git", branch = "nonstatic_lifetime_support" }
chacha20 = { version = "0.9.1", features = ["std", "zeroize"] }
fatfs = { git = "https://github.com/twizzler-operating-system/rust-fatfs.git", branch = "zphrs-rwproxy", version = "0.4.0", features = [
    "std",
    "log_level_info",
    "lfn",
    "alloc",
], default-features = false }
rand = "0.8"
intervaltree = { version = "0.2.7", features = ["serde"] }
tracing = "*"
efs = { git = "https://github.com/dbittman/efs", features = [
    "std",
    "ext2",
], branch = "twizzler-2025-04" }
lru = "*"
lwext4-rs = { path = "../../../ports/lwext4-rs" }
futures = "*"

[target.'cfg(target_os = "twizzler")'.dependencies]
twizzler-abi = { path = "../../../lib/twizzler-abi" }
twizzler = { path = "../../../lib/twizzler" }

[dev-dependencies]
tracing-subscriber = "*"
